name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (macOS)
        run: |
          xcodebuild build \
            -scheme Sonaro \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (macOS)
        run: |
          xcodebuild test \
            -scheme Sonaro \
            -destination 'platform=macOS'
